<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">
<meta name="theme-color" content="#ffffff">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Eye Gesture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- THEME: DARK CYBERPUNK --- */
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #020617; /* Deep Dark Blue/Black */
            color: #e2e8f0;
            overflow: hidden;
            user-select: none;
        }

        /* --- CAMERA BOX (FIXED ALIGNMENT) --- */
        #cam-wrapper {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px; 
            /* Aspect ratio auto-adjustment to match camera input exactly */
            height: auto; 
            min-height: 160px;
            border: 2px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            z-index: 50;
            background: #000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.8);
        }

        /* Ensure video is NOT cropped so lines match perfectly */
        #webcam {
            width: 100%;
            height: auto;
            transform: scaleX(-1); /* Mirror */
            display: block;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Mirror to match video */
            z-index: 10;
        }

        /* --- ANIMATIONS --- */
        .alarm-active { animation: panic-mode 0.2s infinite; }

        @keyframes panic-mode {
            0% { background-color: #020617; box-shadow: inset 0 0 0 red; }
            50% { background-color: #450a0a; box-shadow: inset 0 0 150px red; }
            100% { background-color: #020617; box-shadow: inset 0 0 0 red; }
        }

        /* --- UI ELEMENTS --- */
        #system-log {
            font-size: 10px;
            color: #64748b;
            margin-top: 15px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            min-height: 40px;
            max-height: 80px;
            overflow-y: auto;
            border: 1px solid #1e293b;
        }
        .log-success { color: #22c55e; }
        .log-warn { color: #f59e0b; }

        /* Error Modal for PiP */
        #pip-error-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- ERROR MODAL (If used inside Acode Preview) -->
    <div id="pip-error-modal" class="flex-col text-center">
        <div class="text-6xl mb-4">⚠️</div>
        <h2 class="text-xl font-bold text-white mb-2">Background Mode Error</h2>
        <p class="text-sm text-gray-400 mb-6 leading-relaxed">
            The Acode internal preview cannot run in the background.<br>
            To use this while reading PDFs, you must:<br><br>
            1. Tap the menu (3 dots) ↗<br>
            2. Select <span class="text-green-400 font-bold">"Open in Browser"</span>
        </p>
        <button onclick="document.getElementById('pip-error-modal').style.display='none'" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-white font-bold shadow-lg border border-blue-400">
            UNDERSTOOD
        </button>
    </div>

    <!-- MAIN INTERFACE -->
    <div class="z-10 flex flex-col items-center space-y-6 w-full px-6">
        
        <!-- Header -->
        <div class="flex flex-col items-center">
            <div id="main-icon" class="text-7xl mb-4 drop-shadow-[0_0_15px_rgba(34,197,94,0.5)]">👁️</div>
            <h1 id="status-header" class="text-3xl font-extrabold tracking-tighter text-blue-500 drop-shadow-md">
                SYSTEM BOOT
            </h1>
        </div>

        <!-- Eye Level Meter -->
        <div class="w-full max-w-xs bg-slate-900 h-4 rounded-full overflow-hidden relative border border-slate-700 shadow-inner">
            <div id="blink-bar" class="h-full bg-emerald-500 w-0 transition-all duration-75 shadow-[0_0_10px_#10b981]"></div>
        </div>
        <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Eye Closure Level</p>

        <!-- Buttons -->
        <button id="start-btn" class="hidden w-full max-w-xs py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-[0_4px_0_rgb(6,78,59)] active:shadow-none active:translate-y-[4px] transition-all border-2 border-emerald-400">
            START SYSTEM
        </button>

        <button id="bg-mode-btn" class="hidden w-full max-w-xs py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-[0_4px_0_rgb(30,58,138)] active:shadow-none active:translate-y-[4px] transition-all border-2 border-blue-400 flex flex-col items-center leading-tight">
            <span>ACTIVATE BACKGROUND MODE</span>
            <span class="text-[9px] font-normal opacity-80 mt-1">For Multitasking / PDF Reading</span>
        </button>

        <!-- Terminal Log -->
        <div id="system-log">
            <div>> Initializing Neural Net...</div>
        </div>

        <!-- Sensitivity Slider -->
        <div id="settings-area" class="hidden w-full max-w-xs p-4 bg-slate-900/80 backdrop-blur rounded-xl border border-slate-700 shadow-lg">
            <label class="flex justify-between text-xs font-bold text-slate-400 mb-2">
                <span>SENSITIVITY TRIGGER</span>
                <span id="sens-val" class="text-emerald-400">50%</span>
            </label>
            <input type="range" id="sensitivity" min="0.3" max="0.7" step="0.05" value="0.5" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500">
        </div>
    </div>

    <!-- CAMERA + HUD -->
    <div id="cam-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script type="module">
        import {
            FaceLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm";

        // DOM Elements
        const logBox = document.getElementById('system-log');
        const statusHeader = document.getElementById('status-header');
        const mainIcon = document.getElementById('main-icon');
        const startBtn = document.getElementById('start-btn');
        const bgModeBtn = document.getElementById('bg-mode-btn');
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const canvasCtx = canvas.getContext('2d');
        const blinkBar = document.getElementById('blink-bar');
        const settingsArea = document.getElementById('settings-area');
        const sensitivityInput = document.getElementById('sensitivity');
        const sensVal = document.getElementById('sens-val');
        const errorModal = document.getElementById('pip-error-modal');

        // State
        let faceLandmarker;
        let lastVideoTime = -1;
        let isMonitoring = false;
        let eyesClosedStart = 0;
        let alarmTriggered = false;
        
        // Settings
        let BLINK_THRESHOLD = 0.5; 
        const ALARM_DELAY_MS = 300; 
        
        // Audio
        let audioCtx;
        let sirenOsc;
        let isSirenOn = false;

        // Eye Indices (Face Mesh)
        const LEFT_EYE = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246, 33];
        const RIGHT_EYE = [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398, 362];

        function log(msg, type = 'sys') {
            const div = document.createElement('div');
            div.innerText = `> ${msg}`;
            div.className = type === 'warn' ? 'log-warn' : 'log-success';
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 1. Load AI
        async function initAI() {
            try {
                const filesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: true,
                    runningMode: "VIDEO",
                    numFaces: 1
                });
                statusHeader.innerText = "SYSTEM READY";
                statusHeader.className = "text-3xl font-extrabold text-emerald-400 drop-shadow-md";
                startBtn.classList.remove("hidden");
            } catch (e) {
                log("Load Failed. Check Internet.", "warn");
            }
        }

        // 2. Start
        startBtn.addEventListener("click", () => {
            // Audio Unlock
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const silentOsc = audioCtx.createOscillator();
            const silentGain = audioCtx.createGain();
            silentGain.gain.value = 0.0001; 
            silentOsc.connect(silentGain); silentGain.connect(audioCtx.destination); silentOsc.start();
            
            // Camera
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 480, height: 360 } }).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    startLoop();
                    startBtn.classList.add("hidden");
                    bgModeBtn.classList.remove("hidden");
                    settingsArea.classList.remove("hidden");
                    statusHeader.innerText = "SCANNING";
                    statusHeader.className = "text-3xl font-extrabold text-blue-400 drop-shadow-md";
                    isMonitoring = true;
                });
            });
        });

        // 3. Background Mode
        bgModeBtn.addEventListener("click", async () => {
            try {
                if (video.readyState >= 1) {
                    await video.requestPictureInPicture();
                    log("Background Mode: ACTIVE", "success");
                }
            } catch (error) {
                errorModal.style.display = "flex"; // Show custom helpful error
            }
        });

        // 4. Detection Loop
        function startLoop() {
            const loopLogic = () => {
                if (!isMonitoring) return;
                
                // CRITICAL FIX: Match canvas size to video natural size for perfect alignment
                if (video.videoWidth > 0 && canvas.width !== video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }

                if (lastVideoTime !== video.currentTime && faceLandmarker) {
                    lastVideoTime = video.currentTime;
                    processResults(faceLandmarker.detectForVideo(video, performance.now()));
                }
            };
            
            const animLoop = () => { loopLogic(); requestAnimationFrame(animLoop); };
            animLoop();
            setInterval(() => { if (document.hidden || document.pictureInPictureElement) loopLogic(); }, 150);
        }

        // 5. Logic
        function processResults(results) {
            if (!document.pictureInPictureElement) canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
                const categories = results.faceBlendshapes[0].categories;
                const avgBlink = (categories.find(c => c.categoryName === "eyeBlinkLeft").score + categories.find(c => c.categoryName === "eyeBlinkRight").score) / 2;
                
                // Draw Green/Red Lines (Only when not in PiP)
                if (!document.pictureInPictureElement && results.faceLandmarks && results.faceLandmarks.length > 0) {
                    const color = avgBlink > BLINK_THRESHOLD ? "#EF4444" : "#10B981";
                    
                    [LEFT_EYE, RIGHT_EYE].forEach(indices => {
                        canvasCtx.beginPath(); 
                        canvasCtx.strokeStyle = color; 
                        canvasCtx.lineWidth = 2;
                        canvasCtx.shadowBlur = 10;
                        canvasCtx.shadowColor = color;
                        
                        indices.forEach((idx, i) => {
                            const p = results.faceLandmarks[0][idx];
                            // Raw coordinates map 0-1 to canvas width/height
                            const x = p.x * canvas.width;
                            const y = p.y * canvas.height;
                            
                            if (i === 0) canvasCtx.moveTo(x, y);
                            else canvasCtx.lineTo(x, y);
                        });
                        canvasCtx.closePath(); canvasCtx.stroke();
                    });
                }

                // Meter
                const pct = Math.round(avgBlink * 100);
                blinkBar.style.width = `${pct}%`;

                // Threshold Check
                if (avgBlink > BLINK_THRESHOLD) {
                    blinkBar.classList.replace("bg-emerald-500", "bg-red-500");
                    blinkBar.style.boxShadow = "0 0 15px #EF4444";
                    
                    if (eyesClosedStart === 0) { 
                        eyesClosedStart = Date.now(); 
                        statusHeader.innerText = "WARNING"; 
                        statusHeader.className = "text-3xl font-bold text-yellow-400 drop-shadow-md"; 
                    }
                    
                    if (Date.now() - eyesClosedStart > ALARM_DELAY_MS && !alarmTriggered) triggerAlarm();
                } else {
                    blinkBar.classList.replace("bg-red-500", "bg-emerald-500");
                    blinkBar.style.boxShadow = "0 0 10px #10B981";
                    eyesClosedStart = 0; 
                    stopAlarm();
                    if(!alarmTriggered) { 
                        statusHeader.innerText = "SAFE"; 
                        statusHeader.className = "text-3xl font-extrabold text-emerald-400 drop-shadow-md"; 
                    }
                }
            }
        }

        function triggerAlarm() {
            if (alarmTriggered) return;
            alarmTriggered = true; isSirenOn = true;
            document.body.classList.add("alarm-active");
            statusHeader.innerText = "DANGER"; 
            statusHeader.className = "text-5xl font-black text-red-500 drop-shadow-[0_0_25px_rgba(239,68,68,0.8)]"; 
            mainIcon.innerText = "🚨";
            
            if (audioCtx) {
                sirenOsc = audioCtx.createOscillator(); 
                const gain = audioCtx.createGain();
                sirenOsc.type = 'square'; 
                sirenOsc.connect(gain); gain.connect(audioCtx.destination);
                
                let high = true;
                const loop = setInterval(() => {
                    if (!isSirenOn) { clearInterval(loop); return; }
                    if (sirenOsc) sirenOsc.frequency.setValueAtTime(high ? 850 : 1200, audioCtx.currentTime);
                    high = !high;
                }, 120);
                sirenOsc.start();
            }
        }

        function stopAlarm() {
            if (!alarmTriggered) return;
            alarmTriggered = false; isSirenOn = false;
            document.body.classList.remove("alarm-active");
            mainIcon.innerText = "👁️";
            if (sirenOsc) { try { sirenOsc.stop(); sirenOsc.disconnect(); } catch(e){} sirenOsc = null; }
        }

        sensitivityInput.addEventListener('input', (e) => {
            BLINK_THRESHOLD = parseFloat(e.target.value);
            const pct = Math.round(((0.8 - BLINK_THRESHOLD) / 0.5) * 100);
            sensVal.innerText = pct + "%";
        });

        initAI();
    </script>
</body>
</html>
